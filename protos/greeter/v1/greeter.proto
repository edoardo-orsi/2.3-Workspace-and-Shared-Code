syntax = "proto3";

package greeter.v1;

// The greeter service provides greeting functionality
service Greeter {
  // Send a greeting
  rpc SayHello (HelloRequest) returns (HelloResponse);

  // Send a greeting with custom message
  rpc SayHelloCustom (CustomHelloRequest) returns (HelloResponse);
}

// Request message for SayHello
message HelloRequest {
  string name = 1;
}

// Request message for SayHelloCustom
message CustomHelloRequest {
  string name = 1;
  string greeting = 2;  // Custom greeting like "Hi", "Hey", etc.
}

// Response message containing the greeting
message HelloResponse {
  string message = 1;
  int64 timestamp = 2;  // Unix timestamp when greeting was created
}