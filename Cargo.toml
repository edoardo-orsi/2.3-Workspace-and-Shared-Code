[workspace]
resolver = "3"
members = [
    "shared/*",
    "services/*",
    "gateway",
    "integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Edo"]

[workspace.dependencies]
# Communication
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full", "test-util", "macros"] }
axum = { version = "0.8.8", features = ["macros"] }

# gRPC
tonic = "0.14.2"
prost = "0.14.3"
tonic-prost = "0.14.2"
chrono = "0.4.42"
tonic-reflection = "0.14.3"

# Config & Error
figment = { version = "0.10.19", features = ["yaml", "env"] }
thiserror = { version = "2.0.18" }
validator = { version = "0.20.0", features = ["derive"] }

# Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }

# Build
tonic-prost-build = "0.14.2"
walkdir = "2.5.0"

# Testing
tracing-test = "0.2.5"
tempdir = "0.3.7"
serial_test = "3.3.1"
reqwest = { version = "0.13.2", features = ["json"] }
urlencoding = "2.1.3"
futures = "0.3.31"

# Macro
syn = { version = "2.0.114", features = ["full"] }
quote = "1.0.44"
proc-macro2 = "1.0.106"

# Internal crates
gateway = { path = "./gateway" }
proto_definitions = { path = "shared/proto-definitions" }
common = { path = "shared/common" }
macros = { path = "shared/macros" }
test_helpers = { path = "shared/test-helpers" }
greeter_service = { path = "services/greeter-service"}