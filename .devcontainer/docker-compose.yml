services:
  app:
    # Use the Microsoft Rust Dev Container as the base
    image: mcr.microsoft.com/devcontainers/rust:2.0.8-1-bookworm
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      # This maps your local project root to the container's workspace
      - ..:/workspace:cached
    # Overrides the default command so the container doesn't exit
    command: sleep infinity
    depends_on:
      - db
    environment:
      # Database connection string for your Rust apps
      - DATABASE_URL=postgres://user:password@db:5432/dev_db

  db:
    image: postgres:18.1
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "5433:5432"
    volumes:
      # Persists your database data in a Docker volume (not local folder)
      - postgres_data:/var/lib/postgresql

  otel:
    image: grafana/otel-lgtm:0.17.1
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "3000:3000"     # Grafana UI
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
    volumes:
      - otel_data:/data

volumes:
  postgres_data:
  otel_data:
